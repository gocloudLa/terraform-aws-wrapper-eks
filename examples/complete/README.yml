title: "Complete Example"
description: "This example demonstrates the configuration of EKS clusters using Terraform, including EKS Auto Mode, managed node groups, Karpenter AWS resources, and optional AWS Load Balancer Controller integration."
main_purpose: "The main purpose is to set up one or more EKS clusters with configurable compute (Auto Mode, node groups, or Karpenter) and common addons."
key_features:
  - "**EKS Auto Mode**: Optional cluster with managed node pools (general-purpose) and no classic node groups."
  - "**Managed Node Groups**: Example node group configuration with AMI type, instance types, and scaling."
  - "**Karpenter**: Cluster with Karpenter AWS resources (IAM, SQS, tags) and a controller node group; deploy Karpenter Helm separately."
  - "**Defaults and addons**: Cluster version, endpoint access, control plane logging, CoreDNS, kube-proxy, VPC CNI, EKS Pod Identity Agent."
  - "**AWS Load Balancer Controller**: Subnet tagging on the node-group cluster. Install the controller by hand (kubectl/Helm) or during apply with `components` on `ex-components`."
  - "**EKS Pod Identity**: `pod_identities` for LBC, EBS CSI, and a custom S3 example. Match the LBC ServiceAccount when installing Helm (by hand or via `components`)."
  - "**Cluster components**: `ex-components` installs LBC (`10-lbc`) and a sample nginx app (`15-sample-app`) on `hello.<zone_public>` during apply (AWS provider only)."
  - "**Test ALB without DNS**: after apply, `curl --resolve` against `hello.lab.democorp.cloud` using the Gateway ADDRESS (commands are in `main.tf` next to `15-sample-app`)."
